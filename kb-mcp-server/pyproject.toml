[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-mcp-server"
version = "0.1.0"
description = "MCP server for the ArchiMate Knowledge Base — exposes graph query tools to AI agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "google-auth>=2.0.0",
]

[project.scripts]
kb-mcp = "kb_mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kb_mcp_server*"]
