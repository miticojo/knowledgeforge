version: 2

sources:
  - name: raw_claims
    description: "Raw claims data from Claims Management Platform (PostgreSQL 15)"
    database: archisurance_raw
    schema: claims
    tables:
      - name: claims
        description: "All insurance claims — DataObject: Claim Record"
        columns:
          - name: claim_id
            description: "Primary key"
          - name: customer_id
            description: "FK to customers"
          - name: policy_id
            description: "FK to policies"
          - name: claim_type
            description: "AUTO, HEALTH, PROPERTY, LIABILITY"
          - name: amount
            description: "Claim amount in EUR"
          - name: status
            description: "REGISTERED, PENDING, APPROVED, REJECTED"
          - name: created_at
            description: "Claim registration timestamp"
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

  - name: raw_customers
    description: "Customer data from CRM System (Salesforce CRM)"
    database: archisurance_raw
    schema: crm
    tables:
      - name: customers
        description: "Customer profiles — DataObject: Customer Profile"
        # INTENTIONAL VIOLATION (DG-004): Missing loaded_at_field
        # loaded_at_field: updated_at
        columns:
          - name: customer_id
            description: "Primary key"
          - name: name
            description: "Customer full name"

  - name: raw_fraud_external
    description: "External fraud intelligence feed"
    database: archisurance_external
    schema: fraud
    tables:
      - name: fraud_signals
        description: "External fraud indicators — DataObject: Fraud Score Dataset"
        loaded_at_field: received_at
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 12, period: hour}
