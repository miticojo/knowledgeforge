steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'liteparse'
      - '--image=${_IMAGE}'
      - '--region=europe-west1'
      - '--no-allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--port=8090'
      - '--no-cpu-throttling'
substitutions:
  # Override at build time: gcloud builds submit --substitutions=_IMAGE=...
  _IMAGE: 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/liteparse'
options:
  logging: CLOUD_LOGGING_ONLY
